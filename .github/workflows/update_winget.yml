name: Update WinGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 4.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-winget:
    runs-on: windows-latest

    steps:
      - name: Validate version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify release asset
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $url = "https://github.com/ravachol/kew/releases/download/v$env:VERSION/kew-$env:VERSION-windows-x64.exe"
          Invoke-WebRequest -Uri $url -Method Head -ErrorAction Stop | Out-Null
          "Installer URL verified: $url"

      - name: Download pinned WinGetCreate
        shell: pwsh
        env:
          WINGETCREATE_VERSION: 1.12.13.0
        run: |
          $version = $env:WINGETCREATE_VERSION
          $url = "https://github.com/microsoft/winget-create/releases/download/v$version/wingetcreate.exe"
          Invoke-WebRequest $url -OutFile wingetcreate.exe

          if (!(Test-Path .\wingetcreate.exe)) {
                throw "wingetcreate.exe was not downloaded"
          }

    Write-Host "wingetcreate downloaded successfully"

      - name: Diagnose GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }

          try {
            $response = Invoke-WebRequest `
              -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/r/Ravachol/kew" `
              -Headers $headers `
              -ErrorAction Stop

            Write-Host "GitHub API request succeeded: $($response.StatusCode)"
          }
          catch {
            Write-Host "GitHub API request failed: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              Write-Host "HTTP status: $([int]$_.Exception.Response.StatusCode)"
            }
          }

      - name: Submit WinGet update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $url = "https://github.com/ravachol/kew/releases/download/v$env:VERSION/kew-$env:VERSION-windows-x64.exe"

          .\wingetcreate.exe update Ravachol.kew `
            --version $env:VERSION `
            --urls "$url|x64" `
            --release-notes-url "https://github.com/ravachol/kew/releases/tag/v$env:VERSION" `
            --submit `
            --no-open
