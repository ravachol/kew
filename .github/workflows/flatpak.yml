name: Build Flatpak

on:
  push:
    branches:
      - main
      - develop

  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to attach the Flatpak to (leave empty to only build)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  flatpak:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - name: Check out kew
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest dependency versions
        shell: bash
        run: |
          set -euo pipefail

          CHAPA_VERSION=$(curl -fsSL \
            https://api.github.com/repos/hpjansson/chafa/releases/latest \
            | jq -r '.tag_name')

          OPUSFILE_VERSION=$(curl -fsSL \
            https://api.github.com/repos/xiph/opusfile/releases/latest \
            | jq -r '.tag_name')

          FAAD2_VERSION=$(curl -fsSL \
            https://api.github.com/repos/knik0/faad2/releases/latest \
            | jq -r '.tag_name')

          echo "Chafa:     $CHAPA_VERSION"
          echo "Opusfile:  $OPUSFILE_VERSION"
          echo "FAAD2:     $FAAD2_VERSION"

          echo "CHAPA_VERSION=$CHAPA_VERSION" >> "$GITHUB_ENV"
          echo "OPUSFILE_VERSION=$OPUSFILE_VERSION" >> "$GITHUB_ENV"
          echo "FAAD2_VERSION=$FAAD2_VERSION" >> "$GITHUB_ENV"

      - name: Update dependency versions
        shell: bash
        run: |
          sed -i \
            "s/tag: 1.18.3/tag: ${CHAPA_VERSION}/" \
            com.kewplayer.kew.yml

          sed -i \
            "s/tag: v0.12/tag: ${OPUSFILE_VERSION}/" \
            com.kewplayer.kew.yml

          sed -i \
            "s/tag: 2.11.4/tag: ${FAAD2_VERSION}/" \
            com.kewplayer.kew.yml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: com.kewplayer.kew.yml
          bundle: kew.flatpak
          artifact-name: kew-flatpak-x86_64
          branch: stable
          cache-key: kew-flatpak-${{ hashFiles('com.kewplayer.kew.yml') }}
          upload-artifact: true

      - name: Upload Flatpak to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi

          echo "Uploading kew.flatpak to release $TAG"

          gh release upload "$TAG" kew.flatpak \
            --repo "${{ github.repository }}" \
            --clobber
