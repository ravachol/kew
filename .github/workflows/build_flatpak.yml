name: Build Flatpak

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (e.g. v4.3.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  flatpak:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - name: Check out kew
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Get latest dependency versions
        shell: bash
        run: |
          set -euo pipefail

          CHAPA_VERSION=$(curl -fsSL \
            https://api.github.com/repos/hpjansson/chafa/releases/latest \
            | jq -r '.tag_name')

          OPUSFILE_VERSION=$(curl -fsSL \
            https://api.github.com/repos/xiph/opusfile/releases/latest \
            | jq -r '.tag_name')

          FAAD2_VERSION=$(curl -fsSL \
            https://api.github.com/repos/knik0/faad2/releases/latest \
            | jq -r '.tag_name')

          echo "Chafa:     $CHAPA_VERSION"
          echo "Opusfile:  $OPUSFILE_VERSION"
          echo "FAAD2:     $FAAD2_VERSION"

          echo "CHAPA_VERSION=$CHAPA_VERSION" >> "$GITHUB_ENV"
          echo "OPUSFILE_VERSION=$OPUSFILE_VERSION" >> "$GITHUB_ENV"
          echo "FAAD2_VERSION=$FAAD2_VERSION" >> "$GITHUB_ENV"

      - name: Update dependency versions
        shell: bash
        run: |
          sed -i \
            "s/tag: 1.18.3/tag: ${CHAPA_VERSION}/" \
            com.kewplayer.kew.yml

          sed -i \
            "s/tag: v0.12/tag: ${OPUSFILE_VERSION}/" \
            com.kewplayer.kew.yml

          sed -i \
            "s/tag: 2.11.4/tag: ${FAAD2_VERSION}/" \
            com.kewplayer.kew.yml

      - name: Update Kew source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          COMMIT=$(git rev-parse HEAD)
          export COMMIT

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("com.kewplayer.kew.yml")
          text = path.read_text()

          # Locate the Kew Git source block.
          match = re.search(
              r'(?m)^(\s*- type:\s*git\s*\n(?:(?!^\s*- type:).*\n)*?)',
              text
          )

          blocks = re.finditer(
              r'(?ms)^(\s*- type:.*?)(?=^\s*- type:|\Z)',
              text
          )

          found = False
          result = text

          for block_match in blocks:
              block = block_match.group(0)
              if "https://github.com/ravachol/kew.git" not in block:
                  continue

              block = re.sub(
                  r'(?m)^(\s*tag:\s*).*$',
                  lambda m: m.group(1) + os.environ["RELEASE_TAG"],
                  block,
                  count=1
              )
              block = re.sub(
                  r'(?m)^(\s*commit:\s*).*$',
                  lambda m: m.group(1) + os.environ["COMMIT"],
                  block,
                  count=1
              )

              result = (
                  result[:block_match.start()]
                  + block
                  + result[block_match.end():]
              )
              found = True
              break

          if not found:
              raise SystemExit("Kew Git source block not found")

          path.write_text(result)
          print(f"Updated Kew source to {os.environ['RELEASE_TAG']}")
          print(f"Commit: {os.environ['COMMIT']}")
          PY

          grep -A 5 -B 2 'github.com/ravachol/kew.git' \
            com.kewplayer.kew.yml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: com.kewplayer.kew.yml
          bundle: kew.flatpak
          artifact-name: kew-flatpak-x86_64
          branch: stable
          cache-key: kew-flatpak-${{ hashFiles('com.kewplayer.kew.yml') }}
          upload-artifact: true

      - name: Upload Flatpak to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi

          echo "Uploading kew.flatpak to release $TAG"

          gh release upload "$TAG" kew.flatpak \
            --repo "${{ github.repository }}" \
            --clobber
