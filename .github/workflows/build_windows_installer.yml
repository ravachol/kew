name: Build Windows Installer

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3)"
        required: true
        type: string

      ref:
        description: "Git ref to build (branch, tag, or commit)"
        required: true
        default: "main"
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}


      # -------------------------
      # MSYS2 SETUP
      # -------------------------
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-faad2
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-chafa
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-opusfile
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-cppwinrt

      # -------------------------
      # VERSION
      # -------------------------
      - name: Get version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then VERSION="$INPUT_VERSION"; else VERSION="$GITHUB_REF_NAME"; fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # -------------------------
      # BUILD
      # -------------------------
      - name: Build
        shell: msys2 {0}
        run: |
          mingw32-make -j$(nproc) KEW_VERSION="${{ steps.version.outputs.version }}"

      # -------------------------
      # STAGE INSTALL
      # -------------------------
      - name: Stage install
        shell: msys2 {0}
        run: |
          rm -rf stage
          mkdir -p stage
          mingw32-make install DESTDIR=stage PREFIX= KEW_VERSION="${{ steps.version.outputs.version }}"

      # -------------------------
      # COLLECT DLLs + EXE
      # -------------------------
      - name: Collect DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail

          mkdir -p stage/bin
          cp kew.exe stage/bin/

          ntldd -R kew.exe > dependencies.txt

          # Extract resolved DLL paths from the MSYS2 UCRT64 tree.
          sed -nE \
            's/.*=>[[:space:]]*([A-Za-z]:\\.*\\ucrt64\\bin\\[^[:space:]]+\.dll).*/\1/ip' \
            dependencies.txt |
            sort -fu |
            while IFS= read -r dll; do
              dll="$(cygpath -u "$dll")"

              if [[ ! -f "$dll" ]]; then
                echo "ERROR: Resolved DLL does not exist: $dll"
                exit 1
              fi

              echo "Copying $dll"
              cp -f "$dll" stage/bin/
            done

          echo "==== Bundled DLLs ===="
          find stage/bin -maxdepth 1 -type f -printf '%f\n' | sort

          echo "==== Checking required runtime DLLs ===="
          for dll in \
            libstdc++-6.dll \
            libgcc_s_seh-1.dll \
            libwinpthread-1.dll; do
            if [[ ! -f "stage/bin/$dll" ]]; then
              echo "ERROR: Required runtime DLL missing: $dll"
              exit 1
            fi
          done

      # -------------------------
      # VERIFY DLLs
      # -------------------------
      - name: Verify DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail

          sys32="$(cygpath -u "$SYSTEMROOT")/System32"
          : > missing.txt

          for f in stage/bin/*.exe stage/bin/*.dll; do
            ntldd "$f" \
              | sed -nE 's/^[[:space:]]*([^[:space:]]+\.dll)[[:space:]]+=>.*/\1/Ip' \
              | sort -fu \
              | while IFS= read -r name; do
                  case "${name,,}" in
                    api-ms-win-*|ext-ms-*) continue ;;
                  esac
                  [[ -f "stage/bin/$name" ]] && continue
                  [[ -f "$sys32/$name" ]] && continue
                  echo "$(basename "$f") needs $name" >> missing.txt
                done
          done

          if [[ -s missing.txt ]]; then
            echo "::error::DLLs not bundled and not part of Windows:"
            cat missing.txt
            exit 1
          fi

          echo "All direct dependencies are bundled or provided by Windows."


      # -------------------------
      # FlATTEN DIRECTORY
      # -------------------------
      - name: Flatten stage layout
        shell: msys2 {0}
        run: |
          mv stage/bin/kew.exe stage/
          mv stage/bin/*.dll stage/ 2>/dev/null || true
          rmdir stage/bin 2>/dev/null || true

      # -------------------------
      # SMOKE TEST
      # -------------------------
      - name: Smoke test (no MSYS2 on PATH)
        shell: pwsh
        run: |
          & .\stage\kew.exe --version
          if ($LASTEXITCODE -eq -1073741515) {
            Write-Error "STATUS_DLL_NOT_FOUND: a DLL is missing from stage/"
            exit 1
          }

      # -------------------------
      # BUNDLE DOCS
      # -------------------------
      - name: Bundle docs
        shell: msys2 {0}
        run: |
          mkdir -p stage/docs

          cp kew.ico stage/
          cp PRIVACY_POLICY.md stage/docs/
          cp TERMS.md stage/docs/
          cp LICENSE stage/docs/
          cp README.md stage/docs/

      # -------------------------
      # INSTALL INNO SETUP
      # -------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes

      # -------------------------
      # DEBUG STAGE CONTENTS
      # -------------------------
      - name: Show stage layout
        shell: msys2 {0}
        run: |
          echo "==== stage tree ===="
          find stage -maxdepth 4 -type f | sort
          echo "==== directories ===="
          find stage -maxdepth 4 -type d | sort

      # -------------------------
      # BUILD INSTALLER
      # -------------------------
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          iscc /DMyAppVersion=$version installer.iss

          if (!(Test-Path "Output\kew-$version-windows-x64.exe")) {
            Write-Error "Installer not found"
            exit 1
          }

      # -------------------------
      # ARTIFACT (CI ONLY)
      # -------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kew-${{ steps.version.outputs.version }}-windows-x64
          path: |
            Output/kew-*.exe
          retention-days: 7

      # -------------------------
      # UPLOAD TO GITHUB RELEASE
      # -------------------------
      - name: Create GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          overwrite_files: true
          files: |
            Output/kew-*.exe

