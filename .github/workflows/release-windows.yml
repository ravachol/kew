name: Release Windows

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3)"
        required: true
        type: string

      ref:
        description: "Git ref to build (branch, tag, or commit)"
        required: true
        default: "main"
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}


      # -------------------------
      # MSYS2 SETUP
      # -------------------------
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-faad2
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-chafa
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-opusfile
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-ntldd

      # -------------------------
      # VERSION
      # -------------------------
      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -------------------------
      # BUILD
      # -------------------------
      - name: Build
        shell: msys2 {0}
        run: |
          mingw32-make -j$(nproc) KEW_VERSION="${{ steps.version.outputs.version }}"

      # -------------------------
      # STAGE INSTALL
      # -------------------------
      - name: Stage install
        shell: msys2 {0}
        run: |
          rm -rf stage
          mkdir -p stage
          mingw32-make install DESTDIR=stage PREFIX=

      # -------------------------
      # COLLECT DLLs + EXE
      # -------------------------
      - name: Collect DLLs
        shell: msys2 {0}
        run: |
          mkdir -p stage/bin

          cp kew.exe stage/bin/

          ntldd -R kew.exe \
            | grep -i msys64 \
            | awk '{print $3}' \
            | cygpath -f - \
            | xargs -I{} cp {} stage/bin/

      # -------------------------
      # FlATTEN DIRECTORY
      # -------------------------
      - name: Flatten stage layout
        shell: msys2 {0}
        run: |
          mv stage/bin/kew.exe stage/
          mv stage/bin/*.dll stage/ 2>/dev/null || true
          rmdir stage/bin 2>/dev/null || true

      # -------------------------
      # BUNDLE DOCS
      # -------------------------
      - name: Bundle docs
        shell: msys2 {0}
        run: |
          mkdir -p stage/docs

          cp kew.ico stage/
          cp PRIVACY_POLICY.md stage/docs/
          cp TERMS.md stage/docs/
          cp LICENSE stage/docs/
          cp README.md stage/docs/

      # -------------------------
      # INSTALL INNO SETUP
      # -------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes

      # -------------------------
      # DEBUG STAGE CONTENTS
      # -------------------------
      - name: Show stage layout
        shell: msys2 {0}
        run: |
          echo "==== stage tree ===="
          find stage -maxdepth 4 -type f | sort
          echo "==== directories ===="
          find stage -maxdepth 4 -type d | sort

      # -------------------------
      # BUILD INSTALLER
      # -------------------------
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          iscc /DMyAppVersion=$version installer.iss

          if (!(Test-Path "Output\kew-$version-windows-x64.exe")) {
            Write-Error "Installer not found"
            exit 1
          }

      # -------------------------
      # ARTIFACT (CI ONLY)
      # -------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kew-${{ steps.version.outputs.version }}-windows-x64
          path: |
            Output/kew-*.exe
          retention-days: 7

      # -------------------------
      # UPLOAD TO GITHUB RELEASE
      # -------------------------
      - name: Create GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            Output/kew-*.exe

